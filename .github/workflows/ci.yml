name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: weather_test
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weather" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test
      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'weather_test' || ':memory:' }}
          DB_USERNAME: weather
          DB_PASSWORD: weather

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weather-forecast-collector:ci .
